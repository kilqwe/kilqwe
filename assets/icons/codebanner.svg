<rect x="46" y="152" width="9" height="16" fill="#39d353" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.99;1" dur="1.2s" begin="5.9s;13.9s" repeatCount="4"/>
