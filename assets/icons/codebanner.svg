<svg width="560" height="210" viewBox="0 0 560 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated code block introducing Shreyas, Full-Stack SDE and AI/ML Systems">
<rect x="0" y="0" width="560" height="210" rx="10" fill="#0d1117"/>
<circle cx="24" cy="24" r="6" fill="#ff5f56"/>
<circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="24" r="6" fill="#27c93f"/>
<text x="280" y="29" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">shreyas.ts</text>

<g font-family="monospace" font-size="16">
<clipPath id="l1"><rect x="0" y="-16" width="0" height="26"><animate attributeName="width" from="0" to="230" dur="1s" begin="0.2s;8.2s" fill="freeze"/></rect></clipPath>
<g clip-path="url(#l1)" transform="translate(32,65)">
<text fill="#ff7b72">const </text>
<text x="62" fill="#7ee787">developer</text>
<text x="160" fill="#c9d1d9"> = {</text>
</g>

<clipPath id="l2"><rect x="0" y="-16" width="0" height="26"><animate attributeName="width" from="0" to="330" dur="1.1s" begin="1.4s;9.4s" fill="freeze"/></rect></clipPath>
<g clip-path="url(#l2)" transform="translate(32,90)">
<text fill="#7ee787">  name</text>
<text x="52" fill="#c9d1d9">: </text>
<text x="68" fill="#a5d6ff">"Shreyas",</text>
</g>

<clipPath id="l3"><rect x="0" y="-16" width="0" height="26"><animate attributeName="width" from="0" to="470" dur="1.4s" begin="2.7s;10.7s" fill="freeze"/></rect></clipPath>
<g clip-path="url(#l3)" transform="translate(32,115)">
<text fill="#7ee787">  role</text>
<text x="48" fill="#c9d1d9">: </text>
<text x="64" fill="#a5d6ff">"Full-Stack SDE &#183; AI/ML Systems",</text>
</g>

<clipPath id="l4"><rect x="0" y="-16" width="0" height="26"><animate attributeName="width" from="0" to="330" dur="1.1s" begin="4.3s;12.3s" fill="freeze"/></rect></clipPath>
<g clip-path="url(#l4)" transform="translate(32,140)">
<text fill="#7ee787">  focus</text>
<text x="56" fill="#c9d1d9">: [</text>
<text x="80" fill="#a5d6ff">"backend", "ml"</text>
<text x="210" fill="#c9d1d9">],</text>
</g>

<clipPath id="l5"><rect x="0" y="-16" width="0" height="26"><animate attributeName="width" from="0" to="20" dur="0.3s" begin="5.6s;13.6s" fill="freeze"/></rect></clipPath>
<g clip-path="url(#l5)" transform="translate(32,165)">
